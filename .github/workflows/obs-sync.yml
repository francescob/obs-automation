name: Sync upstream PlasmaZones releases to OBS

on:
  release:
    types: [published]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: fuddlesworth/PlasmaZones
  OBS_PROJECT: home:ilFrance
  OBS_PACKAGE: plasmazones
  OBS_REPO: openSUSE_Tumbleweed
  OBS_USERNAME: ilFrance

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Determine TAG / VERSION
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name // empty') || true
            if [ -z "$TAG" ]; then
              TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/tags" | jq -r '.[0].name')
            fi
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No upstream tag found; nothing to do."
            exit 0
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Upstream tag: $TAG"

      - name: Check OBS secrets
        shell: bash
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OBS_TOKEN}" ]; then
            echo "ERROR: OBS_TOKEN secret missing"
            exit 1
          fi

      - name: Trigger OBS source service run
        shell: bash
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering OBS source service for ${OBS_PROJECT}/${OBS_PACKAGE} (upstream: ${TAG:-unknown})..."
          HTTP_STATUS=$(curl -s -o /tmp/obs_resp.txt -w "%{http_code}" \
            -H "Authorization: Token ${OBS_TOKEN}" \
            -X POST \
            "https://api.opensuse.org/trigger/runservice?project=${OBS_PROJECT}&package=${OBS_PACKAGE}")
          echo "OBS response (HTTP ${HTTP_STATUS}):"
          cat /tmp/obs_resp.txt
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: OBS service trigger failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo "OBS service run triggered successfully."

      - name: Wait for OBS build result
        shell: bash
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          set -euo pipefail
          echo "Polling OBS build results for ${OBS_PROJECT}/${OBS_PACKAGE}..."
          for i in $(seq 1 30); do
            sleep 10
            RESULTS=$(curl -s \
              -H "Authorization: Token ${OBS_TOKEN}" \
              "https://api.opensuse.org/build/${OBS_PROJECT}/_result?package=${OBS_PACKAGE}&repository=${OBS_REPO}" \
              2>/dev/null || true)
            if [ -n "$RESULTS" ]; then
              echo "Poll $i: $RESULTS"
              if echo "$RESULTS" | grep -qi 'state="failed"'; then
                echo "Build FAILED"
                exit 1
              fi
              if echo "$RESULTS" | grep -qi 'state="succeeded"'; then
                echo "Build SUCCEEDED"
                exit 0
              fi
            else
              echo "Poll $i: no response yet"
            fi
          done
          echo "Build monitoring timed out; check OBS manually."
          exit 1
