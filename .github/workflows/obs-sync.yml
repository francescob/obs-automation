name: Sync upstream PlasmaZones releases to OBS

on:
  release:
    types: [published]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: fuddlesworth/PlasmaZones
  OBS_PROJECT: home:ilFrance
  OBS_PACKAGE: plasmazones
  OBS_REPO: openSUSE_Tumbleweed
  OBS_USERNAME: ilFrance

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Determine TAG / VERSION
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name // empty') || true
            if [ -z "$TAG" ]; then
              TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/tags" | jq -r '.[0].name')
            fi
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No upstream tag found; nothing to do."
            exit 0
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Upstream tag: $TAG"

      - name: Check OBS secrets
        shell: bash
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OBS_TOKEN}" ]; then
            echo "ERROR: OBS_TOKEN secret missing"
            exit 1
          fi
          if [ -z "${OBS_PASSWORD}" ]; then
            echo "ERROR: OBS_PASSWORD secret missing"
            exit 1
          fi

      - name: Update OBS _service revision
        id: service_update
        shell: bash
        env:
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -euo pipefail
          touch /tmp/obs_service.xml
          HTTP_STATUS=$(curl -s --ipv4 --connect-timeout 30 --max-time 60 \
            -o /tmp/obs_service.xml -w "%{http_code}" \
            -u "${OBS_USERNAME}:${OBS_PASSWORD}" \
            "https://api.opensuse.org/source/${OBS_PROJECT}/${OBS_PACKAGE}/_service") || true
          echo "Fetched _service (HTTP ${HTTP_STATUS})"
          if [ "${HTTP_STATUS}" = "000" ]; then
            echo "ERROR: Could not connect to OBS API (network/connection error)"
            exit 1
          fi
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Could not fetch _service file"
            cat /tmp/obs_service.xml
            exit 1
          fi
          CURRENT_REVISION=$(sed -n 's|.*<param name="revision">\([^<]*\)</param>.*|\1|p' /tmp/obs_service.xml | head -n1 || true)
          CURRENT_VERSION=$(sed -n 's|.*<param name="version">\([^<]*\)</param>.*|\1|p' /tmp/obs_service.xml | head -n1 || true)
          if [ "${CURRENT_REVISION}" = "${TAG}" ] && [ "${CURRENT_VERSION}" = "${VERSION}" ]; then
            echo "OBS _service already up to date (${TAG}/${VERSION}), skipping PUT."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q '<param name="revision">' /tmp/obs_service.xml || ! grep -q '<param name="version">' /tmp/obs_service.xml; then
            echo "OBS _service has no revision/version params; skipping _service update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ORIGINAL_SERVICE_SHA=$(sha256sum /tmp/obs_service.xml | awk '{print $1}')
          sed -i \
            -e "s|<param name=\"revision\">[^<]*</param>|<param name=\"revision\">${TAG}</param>|g" \
            -e "s|<param name=\"version\">[^<]*</param>|<param name=\"version\">${VERSION}</param>|g" \
            /tmp/obs_service.xml
          UPDATED_SERVICE_SHA=$(sha256sum /tmp/obs_service.xml | awk '{print $1}')
          if [ "${ORIGINAL_SERVICE_SHA}" = "${UPDATED_SERVICE_SHA}" ]; then
            echo "OBS _service revision/version unchanged after substitution, skipping PUT."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Updated _service file:"
          cat /tmp/obs_service.xml
          HTTP_STATUS=$(curl -s --ipv4 --connect-timeout 30 --max-time 60 \
            -o /tmp/obs_put_resp.txt -w "%{http_code}" \
            -u "${OBS_USERNAME}:${OBS_PASSWORD}" \
            -X PUT \
            -T /tmp/obs_service.xml \
            "https://api.opensuse.org/source/${OBS_PROJECT}/${OBS_PACKAGE}/_service?comment=Bump+to+${TAG}") || true
          echo "PUT _service (HTTP ${HTTP_STATUS}):"
          cat /tmp/obs_put_resp.txt
          if [ "${HTTP_STATUS}" != "200" ] && [ "${HTTP_STATUS}" != "201" ]; then
            echo "ERROR: Failed to update OBS _service file"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "OBS _service updated to ${TAG}."

      - name: Update OBS spec Version
        id: spec_update
        shell: bash
        env:
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -euo pipefail
          touch /tmp/obs_spec.spec
          HTTP_STATUS=$(curl -s --ipv4 --connect-timeout 30 --max-time 60 \
            -o /tmp/obs_spec.spec -w "%{http_code}" \
            -u "${OBS_USERNAME}:${OBS_PASSWORD}" \
            "https://api.opensuse.org/source/${OBS_PROJECT}/${OBS_PACKAGE}/${OBS_PACKAGE}.spec") || true
          echo "Fetched spec (HTTP ${HTTP_STATUS})"
          if [ "${HTTP_STATUS}" = "000" ]; then
            echo "ERROR: Could not connect to OBS API (network/connection error)"
            exit 1
          fi
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Could not fetch spec file"
            cat /tmp/obs_spec.spec
            exit 1
          fi
          CURRENT_SPEC_VERSION=$(awk -F ':' '/^Version:/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}' /tmp/obs_spec.spec || true)
          CURRENT_SPEC_VERSION_NORM=$(printf '%s' "${CURRENT_SPEC_VERSION}" | tr -d '[:space:]')
          VERSION_NORM=$(printf '%s' "${VERSION}" | tr -d '[:space:]')
          if [ "${CURRENT_SPEC_VERSION_NORM}" = "${VERSION_NORM}" ]; then
            echo "OBS spec already up to date (${VERSION}), skipping PUT."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -e "s|^Version:.*|Version:        ${VERSION}|" /tmp/obs_spec.spec
          echo "Updated spec file Version line:"
          grep "^Version:" /tmp/obs_spec.spec
          HTTP_STATUS=$(curl -s --ipv4 --connect-timeout 30 --max-time 60 \
            -o /tmp/obs_spec_put_resp.txt -w "%{http_code}" \
            -u "${OBS_USERNAME}:${OBS_PASSWORD}" \
            -X PUT \
            -T /tmp/obs_spec.spec \
            "https://api.opensuse.org/source/${OBS_PROJECT}/${OBS_PACKAGE}/${OBS_PACKAGE}.spec?comment=Bump+Version+to+${VERSION}") || true
          echo "PUT spec (HTTP ${HTTP_STATUS}):"
          cat /tmp/obs_spec_put_resp.txt
          if [ "${HTTP_STATUS}" != "200" ] && [ "${HTTP_STATUS}" != "201" ]; then
            echo "ERROR: Failed to update OBS spec file"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "OBS spec updated to ${VERSION}."

      - name: Trigger OBS source service run
        if: steps.service_update.outputs.changed == 'true' || steps.spec_update.outputs.changed == 'true'
        shell: bash
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering OBS source service for ${OBS_PROJECT}/${OBS_PACKAGE} (upstream: ${TAG:-unknown})..."
          HTTP_STATUS=$(curl -s --ipv4 --connect-timeout 30 --max-time 60 \
            -o /tmp/obs_resp.txt -w "%{http_code}" \
            -H "Authorization: Token ${OBS_TOKEN}" \
            -X POST \
            "https://api.opensuse.org/trigger/runservice?project=${OBS_PROJECT}&package=${OBS_PACKAGE}") || true
          echo "OBS response (HTTP ${HTTP_STATUS}):"
          cat /tmp/obs_resp.txt
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: OBS service trigger failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo "OBS service run triggered successfully."

      - name: Skip OBS trigger (already synced)
        if: steps.service_update.outputs.changed != 'true' && steps.spec_update.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No upstream changes detected in OBS files; skipping trigger and build wait."

      - name: Wait for OBS build result
        if: steps.service_update.outputs.changed == 'true' || steps.spec_update.outputs.changed == 'true'
        shell: bash
        env:
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Polling OBS build results for ${OBS_PROJECT}/${OBS_PACKAGE}..."
          for i in $(seq 1 30); do
            sleep 10
            HTTP_STATUS=$(curl -s --ipv4 --connect-timeout 30 --max-time 60 \
              -o /tmp/obs_build_result.xml -w "%{http_code}" \
              -u "${OBS_USERNAME}:${OBS_PASSWORD}" \
              "https://api.opensuse.org/build/${OBS_PROJECT}/_result?package=${OBS_PACKAGE}&repository=${OBS_REPO}") || true
            RESULTS=$(cat /tmp/obs_build_result.xml 2>/dev/null || true)
            if [ "${HTTP_STATUS}" = "401" ]; then
              echo "ERROR: Authentication failed (HTTP 401). Check OBS_PASSWORD secret."
              exit 1
            fi
            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "Poll $i (HTTP ${HTTP_STATUS}): temporary OBS API issue, retrying..."
              continue
            fi
            if [ -n "$RESULTS" ]; then
              SUMMARY=$(echo "$RESULTS" | tr '\n' ' ' | sed 's/  */ /g')
              echo "Poll $i (HTTP ${HTTP_STATUS}): $SUMMARY"
              if grep -Eqi "state=['\"]failed['\"]|code=['\"](failed|broken|unresolvable)['\"]" /tmp/obs_build_result.xml; then
                echo "Build FAILED in OBS"
                exit 1
              fi
              if grep -Eqi "dirty=['\"]true['\"]" /tmp/obs_build_result.xml; then
                continue
              fi
              TOTAL_CODE_RESULTS=$( (grep -Eo "code=['\"][^'\"]+['\"]" /tmp/obs_build_result.xml || true) | wc -l | tr -d ' ')
              SUCCESS_RESULTS=$( (grep -Eo "code=['\"]succeeded['\"]" /tmp/obs_build_result.xml || true) | wc -l | tr -d ' ')
              if [ "${TOTAL_CODE_RESULTS}" -gt 0 ] && [ "${SUCCESS_RESULTS}" -eq "${TOTAL_CODE_RESULTS}" ]; then
                echo "Build SUCCEEDED"
                exit 0
              fi
            else
              echo "Poll $i: no response yet"
            fi
          done
          echo "Build monitoring timed out; check OBS manually."
          exit 1
